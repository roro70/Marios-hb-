<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Marios 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="intro">
            <p class="small-text">A little surprise for</p>
            <h1>Marios 💗</h1>
            <p class="instruction">
                Make a wish... ✨
            </p>
        </div>

        <div id="countdown"></div>

        <div class="cake-container">

            <div class="candles">

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

            </div>

            <div class="cake">

                <div class="cake-top">
                    <div class="cream"></div>
                </div>

                <div class="cake-middle"></div>

                <div class="cake-bottom"></div>

            </div>

        </div>

        <button id="startButton">
            🎂 Blow the candles
        </button>

        <div id="birthdayMessage">

            <div class="sparkles">✨ ♡ ✨</div>

            <h2>Happy Birthday, Marios! 🎉</h2>

            <p>
                I hope your day is filled with happiness,
                laughter and all the little things that make
                you smile. 💗
            </p>

            <div class="sparkles">🧁 ✨ 🎀</div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
